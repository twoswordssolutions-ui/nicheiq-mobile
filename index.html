splay:grid;gap:13px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:17px;min-width:0;box-shadow:0 4px 18px #0000000a}.card h2{margin:0;font-size:16px;letter-spacing:-.3px}.card h3{margin:0 0 6px;font-size:14px}.kpi-label{font-size:12px;color:var(--muted);line-height:1.3}.kpi-num{font-size:32px;font-weight:830;letter-spacing:-1px;margin-top:7px;font-variant-numeric:tabular-nums}.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}.split{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:start}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionhead h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.datatable{border-collapse:collapse;width:100%;font-size:13px;min-width:540px}.datatable th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--border)}.datatable td{padding:13px 8px;border-bottom:1px solid #29454e;vertical-align:top}.datatable tr:last-child td{border-bottom:none}.datatable tr:hover td{background:#ffffff08}.strong{font-weight:750}.score{font-weight:850;font-size:19px;font-variant-numeric:tabular-nums}.score.high{color:var(--mint)}.score.med{color:var(--amber)}.score.low{color:var(--red)}.pill{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid #477065;background:#25493d;border-radius:20px;color:#a6e5bf;font-size:11px;font-weight:800;line-height:1.1}.pill.warn{background:#4b3c27;color:var(--amber);border-color:#6d5732}.pill.dim{color:var(--muted);border-color:#466069;background:#25404a}.pill.bad{color:var(--red);border-color:#794e4c;background:#482c30}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:11px}.listitem{padding:13px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.listitem:last-child{border-bottom:none}.listitem p{margin:4px 0 0}.empty{color:var(--muted);background:#102831;border:1px dashed var(--border);border-radius:13px;text-align:center;padding:27px 20px;line-height:1.5}.empty b{display:block;color:var(--text);margin-bottom:3px}.chart{width:100%;height:135px;display:block;overflow:visible}.chartlabel{font-size:11px;color:var(--muted);margin-top:6px}.tabs{display:flex;gap:7px;margin-bottom:17px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:9px 13px;border-radius:22px;font-size:13px;font-weight:750}.tab.active{color:var(--mint-ink);background:var(--mint);border-color:var(--mint)}.recordcard{display:flex;gap:12px;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--border)}.recordcard:last-child{border-bottom:0}.recordcard h3{margin:0 0 3px;font-size:15px}.recordcard .recordmeta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.recordcard .recordmeta span{font-size:11px;border-radius:6px;padding:5px 7px;background:#28434d;color:var(--muted)}.recordactions{display:flex;gap:6px;align-items:start;flex-shrink:0}.detail{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:12px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:none;justify-content:space-around;padding:8px 8px max(9px,env(safe-area-inset-bottom));background:#102831fa;border-top:1px solid #34545c;box-shadow:0 -12px 30px #0005}.navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;min-width:58px;background:none;border:0;color:var(--muted);font-size:10px;font-weight:700}.navbtn svg{width:21px;height:21px}.navbtn.active{color:var(--mint)}.modalbackdrop{position:fixed;inset:0;z-index:90;background:#020c10ba;display:flex;align-items:center;justify-content:center;padding:14px}.modal{background:#142c35;border:1px solid #41616a;border-radius:20px;box-shadow:var(--shadow);width:min(690px,100%);max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}.modalhead{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.modalhead h2{font-size:20px;margin:0}.modalbody{overflow:auto;padding:19px 20px}.modalfoot{border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:8px;justify-content:flex-end}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:750;color:#c4dddd}.field .helper{font-size:11px;color:var(--muted);margin-top:4px}.field textarea{min-height:77px;resize:vertical}.context{border-radius:12px;padding:11px 12px;background:#1e3e43;border:1px solid #37605b;color:#cce5d9;font-size:12px}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#d1f3db;color:#17342b;padding:10px 14px;border-radius:11px;z-index:120;box-shadow:var(--shadow);font-size:13px;font-weight:760;max-width:90vw}.hr{border:0;border-top:1px solid var(--border);margin:18px 0}.notice{color:var(--muted);font-size:12px;line-height:1.55}.statline{display:flex;justify-content:space-between;margin:8px 0;font-size:13px;gap:12px}.statline b{font-variant-numeric:tabular-nums}.boxlink{display:inline-flex;margin:5px 0;text-decoration:none;font-size:12px}.desktopnav{display:flex;gap:4px}.desktopnav .tab{border:0;background:transparent}.desktopnav .tab.active{background:#264c43;color:var(--mint)}.hide{display:none!important}
@media(max-width:700px){.shell{padding:0 13px 98px}.topinner{padding:10px 13px}.topright .sync{display:none}.desktopnav{display:none}.bottomnav{display:flex}.mainhead{padding:20px 0 15px;align-items:flex-start}.mainhead h1{font-size:27px}.mainhead .btn{font-size:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-num{font-size:28px}.split{grid-template-columns:1fr}.card{padding:14px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.modalbackdrop{padding:0;align-items:flex-end}.modal{border-radius:20px 20px 0 0;max-height:94dvh;width:100%}.modalbody{padding:15px}.modalhead{padding:15px}.modalfoot{padding:12px 15px max(13px,env(safe-area-inset-bottom))}.search{width:100%}.filters{width:100%}.filters select{max-width:none;flex:1}.recordcard{gap:5px}.recordactions{flex-direction:column}.btn.tiny{padding:6px 8px}.tablewrap{margin:0 -6px}.smallphone{display:none}}@media(min-width:701px){.shell{padding-bottom:35px}}

.autobanner{border:1px solid #34645b;background:linear-gradient(125deg,#173830,#15303b);padding:17px;border-radius:16px;margin-bottom:17px}
.autobanner h2{margin:3px 0 7px;font-size:19px}.autobanner p{margin:8px 0 13px;line-height:1.5}.autoactions{display:flex;flex-wrap:wrap;gap:8px}

<body>
<header class="top"><div class="topinner"><div class="brand"><div class="logo" aria-hidden="true">N</div><div>NicheIQ <span class="muted" style="font-weight:500">/ Etsy</span></div></div><nav id="desktopnav" class="desktopnav" aria-label="Main navigation"></nav><div class="topright"><span class="sync"><span class="syncdot"></span>Stored on device</span><button class="btn tiny ghost" id="backupTop" title="Export a backup">⇩ Backup</button></div></div></header>
<main class="shell"><div class="mainhead"><div><div class="eyebrow">MARKET RESEARCH WORKSPACE</div><h1 id="pageTitle">Dashboard</h1><div id="pageSub" class="muted small hero">Research opportunities, not guesses.</div></div><button class="btn primary" id="quickAdd">+ Add record</button></div><div id="filterBar" class="filters" style="margin-bottom:15px"><select id="nicheFilter" aria-label="Filter by niche"></select><button class="btn tiny ghost" id="researchPrompt">Copy research prompt</button></div><section id="view" aria-live="polite"></section></main>
<nav id="bottomnav" class="bottomnav" aria-label="Main navigation"></nav><div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div><input id="importFile" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const STORAGE='etsy_nicheiq_android_v1';
const emptyData=()=>({version:1,createdAt:new Date().toISOString(),niches:[],keywords:[],opps:[],competitors:[],reviews:[],sources:[],experiments:[],settings:{feePct:9.5,feeFlat:0.25,laborHourly:15,minMargin:20}});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE))||emptyData()}catch(_){db=emptyData()}
for(const k of ['niches','keywords','opps','competitors','reviews','sources','experiments'])if(!Array.isArray(db[k]))db[k]=[];
db.settings={...emptyData().settings,...(db.settings||{})};
let page='dashboard',section='competitors',selectedNiche='all';const LABELS={auto:'Auto Research',dashboard:'Dashboard',niches:'Niches',keywords:'Keywords',opps:'Opportunities',trends:'Trends',records:'Research records',data:'Data & settings'};
const SVG={auto:'<path d="m12 2 2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',niches:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>',keywords:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',opps:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>',trends:'<path d="m3 17 6-6 4 4 8-8"/><path d="M16 7h5v5"/>',records:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',data:'<path d="M4 7a8 3 0 0 0 16 0 8 3 0 0 0-16 0zm0 0v10a8 3 0 0 0 16 0V7M4 12a8 3 0 0 0 16 0"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[k]||SVG.records}</svg>`;
const fmt=(n,dec=0)=>Number.isFinite(Number(n))?Number(n).toLocaleString('en-US',{maximumFractionDigits:dec,minimumFractionDigits:dec}):'—';
const money=n=>'$'+fmt(n,2);const pct=n=>Number.isFinite(n)?(n>=0?'+':'')+fmt(n*100,1)+'%':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const tday=()=>new Date().toLocaleDateString('en-CA');const nowISO=()=>new Date().toISOString();const uid=k=>k.toUpperCase().slice(0,3)+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5);
const filt=a=>(selectedNiche==='all'?a:a.filter(r=>r.nicheId===selectedNiche||r.id===selectedNiche));const nicheName=id=>db.niches.find(n=>n.id===id)?.name||'Unassigned';
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db));}catch(e){alert('Device storage is full or unavailable. Export a JSON backup now.');return} render();}
function route(p){page=p;render();window.scrollTo({top:0,behavior:'auto'})}function btn(action,label,cls=''){return `<button type="button" class="btn ${cls}" data-action="${action}">${label}</button>`}
const lastSorted=a=>[...a].sort((x,y)=>String(y.date||y.createdAt||'').localeCompare(String(x.date||x.createdAt||'')));
const numeric=x=>x===''||x===null||x===undefined?null:Number(x);
function results(o){const ratings=['demand','underserved','momentum','gap','economics','feasibility'].map(k=>numeric(o[k]));const complete=ratings.every(n=>n!==null&&n>=0&&n<=5);const weights=[.25,.20,.15,.15,.15,.10];const score=complete?Math.round(20*ratings.reduce((a,r,i)=>a+r*weights[i],0)*10)/10:null;const revenue=Number(o.price||0)+Number(o.buyerShip||0);const fees=revenue*(Number(db.settings.feePct||0)/100)+Number(db.settings.feeFlat||0);const labor=Number(o.laborMin||0)/60*Number(db.settings.laborHourly||0);const expenses=Number(o.material||0)+Number(o.packaging||0)+Number(o.shippingCost||0)+Number(o.otherCost||0)+fees+labor;const contribution=revenue-expenses;const margin=revenue>0?contribution/revenue:null;let decision='RESEARCH';if(o.policyGate==='Fail')decision='REJECT';else if(o.policyGate!=='Pass'||score===null||!o.price||numeric(o.confidence)===null||margin===null)decision='INCOMPLETE';else if(score>=80&&Number(o.confidence)>=3&&margin>=Number(db.settings.minMargin||20)/100)decision='TEST';else if(score>=65)decision='INVESTIGATE';else decision='WATCH';return{score,fees,labor,revenue,contribution,margin,decision}}
function scoreclass(s){return s===null?'':s>=80?'high':s>=65?'med':'low'}function pill(text,mode='dim'){return `<span class="pill ${mode}">${esc(text)}</span>`}function dStatus(r){return r.decision==='TEST'?'':r.decision==='REJECT'?'bad':r.decision==='INVESTIGATE'?'warn':'dim'}
function keywordChanges(){const by=new Map();for(const k of db.keywords){let ky=`${k.nicheId}|${String(k.term||'').trim().toLowerCase()}`;if(!by.has(ky))by.set(ky,[]);by.get(ky).push(k)}let out=[];for(const series of by.values()){series.sort((a,b)=>String(a.date).localeCompare(String(b.date)));if(series.length<2)continue;const c=series.at(-1),p=series.at(-2);const current=numeric(c.searches),prior=numeric(p.searches),lis=numeric(c.listings),prevLis=numeric(p.listings);const growth=prior>0&&current!==null?current/prior-1:null;const lgrowth=prevLis>0&&lis!==null?lis/prevLis-1:null;const past=series.length>2?series.at(-3):null;const previousGrowth=past&&numeric(past.searches)>0&&numeric(p.searches)!==null?(Number(p.searches)/Number(past.searches)-1):null;const candidate=growth!==null&&lgrowth!==null&&growth>=.30&&lgrowth<=.15;const confirmed=candidate&&previousGrowth>=.30&&!!String(c.corroboration||'').trim()&&['A','B'].includes(c.evidence);out.push({...c,growth,lgrowth,prior,current,lis,candidate,confirmed,samples:series.length})}return out.sort((a,b)=>(b.growth||-999)-(a.growth||-999))}
function nav(){const tabs=['dashboard','auto','niches','keywords','opps','trends','records','data'];document.getElementById('desktopnav').innerHTML=tabs.map(x=>`<button class="tab ${x===page?'active':''}" data-page="${x}">${LABELS[x]}</button>`).join('');document.getElementById('bottomnav').innerHTML=['dashboard','auto','niches','opps','records'].map(x=>`<button class="navbtn ${x===page||(x==='records'&&['trends','data'].includes(page))?'active':''}" data-page="${x}">${icon(x)}<span>${x==='opps'?'Opportunities':x==='auto'?'Research':x==='records'?'More':LABELS[x]}</span></button>`).join('')}
function render(){nav();document.getElementById('pageTitle').textContent=LABELS[page];document.getElementById('pageSub').textContent=({dashboard:'Automated research appears after a successful GitHub Action.',auto:'Public third-party research, refreshed by GitHub Actions.',niches:'Define segments, buyers, constraints and lifecycle.',keywords:'Append dated observations. Never overwrite history.',opps:'Evaluate concepts, costs and test readiness.',trends:'Signals calculated from dated keyword snapshots.',records:'Competitors, customer feedback, sources, and experiments.',data:'Back up, restore and manage local settings.'})[page];const filter=document.getElementById('nicheFilter');filter.innerHTML=`<option value="all">All niches</option>`+db.niches.map(n=>`<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');if(selectedNiche!=='all'&&!db.niches.some(n=>n.id===selectedNiche))selectedNiche='all';filter.value=selectedNiche;document.getElementById('quickAdd').textContent=page==='dashboard'?'+ Auto niche':page==='auto'?'+ Auto niche':page==='niches'?'+ Auto niche':page==='trends'?'+ Keyword snapshot':page==='data'?'⇩ Backup':'+ Add record';document.getElementById('view').innerHTML=({dashboard:renderDashboard,auto:renderAutoResearch,niches:renderNichesPage,keywords:()=>renderList('keywords'),opps:renderOpportunitiesPage,trends:renderTrends,records:renderRecords,data:renderData})[page]();}
const cardEmpty=(what,add)=>`<div class="empty"><b>${what}</b>${add||'Add your first observation to begin building a research baseline.'}</div>`;
function renderDashboard(){const niches=filt(db.niches),kws=filt(db.keywords),opps=filt(db.opps),alerts=keywordChanges().filter(k=>selectedNiche==='all'||k.nicheId===selectedNiche).filter(k=>k.candidate),ready=opps.filter(o=>results(o).decision==='TEST');const top=[...opps].filter(o=>results(o).score!==null).sort((a,b)=>results(b).score-results(a).score).slice(0,5);const recent=lastSorted([...kws,...filt(db.competitors),...filt(db.reviews)].map(x=>({...x,date:x.date||x.createdAt}))).slice(0,5);return `${autoHero()}<div class="grid kpis">${[['Auto niches',autoData?.niches?.length||0,'Scheduled public research'],['Auto opportunities',(autoData?.niches||[]).reduce((sum,n)=>sum+(n.opportunities||[]).length,0),'Candidate product concepts'],['Manual keywords',kws.length,'Device-only history'],['Manual test candidates',ready.length,'Pass configured gates']].map(([l,n,s])=>`<div class="card"><div class="kpi-label">${l}</div><div class="kpi-num">${fmt(n)}</div><div class="kpi-sub">${s}</div></div>`).join('')}</div>
<div class="grid split"><div class="stack"><article class="card"><div class="sectionhead"><h2>Highest-ranked product concepts</h2>${btn('new:opps','+ Idea','tiny')}</div>${top.length?`<div class="tablewrap"><table class="datatable"><thead><tr><th>Product idea</th><th>Score</th><th>Decision</th></tr></thead><tbody>${top.map(o=>{const r=results(o);return `<tr><td><span class="strong">${esc(o.concept)}</span><div class="muted mini">${esc(nicheName(o.nicheId))}</div></td><td class="score ${scoreclass(r.score)}">${fmt(r.score,1)}</td><td>${pill(r.decision,dStatus(r))}</td></tr>`}).join('')}</tbody></table></div>`:cardEmpty('No scored product concepts','Create an opportunity, then enter 0–5 factor ratings to calculate its score.')}</article>
<article class="card"><div class="sectionhead"><h2>Search momentum</h2><button class="btn tiny" data-page="trends">All trends →</button></div>${alerts.length?alerts.slice(0,6).map(k=>`<div class="listitem"><div><b>${esc(k.term)}</b><p class="muted small">${esc(nicheName(k.nicheId))} · ${esc(k.date||'')}</p>${k.confirmed?pill('Multi-signal',''):pill('Candidate • verify','warn')}</div><strong class="score high">${pct(k.growth)}</strong></div>`).join(''):cardEmpty('No qualifying alerts','Requires at least two dated, numeric Etsy keyword snapshots. A single observation is not a trend.')}</article></div>

function recordSummary(k,r){if(k==='niches')return{title:r.name,sub:[r.buyer,r.region,r.stage].filter(Boolean).join(' · '),details:r.problem,tags:[r.format,Number(r.budget)?'Budget '+money(r.budget):null]};if(k==='keywords')return{title:r.term,sub:`${nicheName(r.nicheId)} · ${r.date||'Undated'} · ${r.source||'Source unspecified'}`,details:r.notes,tags:[r.searches!==''&&r.searches!=null?'Searches: '+fmt(r.searches):null,r.listings!==''&&r.listings!=null?'Listings: '+fmt(r.listings):null,r.evidence?'Evidence '+r.evidence:null]};if(k==='opps'){const res=results(r);return{title:r.concept,sub:nicheName(r.nicheId),details:r.nextAction,tags:[res.score!==null?'Score '+fmt(res.score,1)+'/100':'Unscored',res.decision,res.margin!==null?'Margin '+pct(res.margin):null]}}if(k==='competitors')return{title:r.shop,sub:`${nicheName(r.nicheId)} · ${r.date||''}`,details:r.weakness,tags:[r.price?money(r.price):null,r.reviewCount?'Reviews '+fmt(r.reviewCount):null]};if(k==='reviews')return{title:r.theme,sub:nicheName(r.nicheId),details:r.notes,tags:[r.sentiment,r.sampleCount?'Matches '+fmt(r.sampleCount):null]};if(k==='sources')return{title:r.name,sub:nicheName(r.nicheId),details:r.limitations,tags:[r.evidence?'Evidence '+r.evidence:null,r.date]};return{title:r.hypothesis,sub:(db.opps.find(o=>o.id===r.oppId)?.concept||'Unlinked opportunity'),details:r.success,tags:[r.outcome,r.orders?'Orders '+fmt(r.orders):null]}}
function renderList(k){const a=(k==='experiments'?db[k]:filt(db[k]));const list=lastSorted(a);const label=defs[k].title;return `<div class="sectionhead"><h2>${esc(label)}s <span class="muted">(${list.length})</span></h2>${btn('new:'+k,'+ Add '+label,'tiny primary')}</div><div class="card">${list.length?list.map(r=>recordCard(k,r)).join(''):cardEmpty('No '+label.toLowerCase()+' records','Use the Add button above to record sourced information.')}</div>`}
function recordCard(k,r){const s=recordSummary(k,r);return `<div class="recordcard"><div style="min-width:0;flex:1"><h3>${esc(s.title||'Untitled')}</h3><div class="muted small">${esc(s.sub||'')}</div>${s.details?`<div class="detail">${esc(s.details)}</div>`:''}<div class="recordmeta">${(s.tags||[]).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('')}</div>${r.url?`<a class="boxlink" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">View source ↗</a>`:''}</div><div class="recordactions">${btn('edit:'+k+':'+r.id,'Edit','tiny')}${btn('delete:'+k+':'+r.id,'×','tiny danger')}</div></div>`}
function safeUrl(x){try{let u=new URL(x);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch(_){return '#'}}
function renderTrends(){const rows=keywordChanges().filter(x=>selectedNiche==='all'||x.nicheId===selectedNiche);return `<div class="sectionhead"><h2>Keyword trend signals</h2>${btn('new:keywords','+ New snapshot','tiny primary')}</div><div class="context" style="margin-bottom:15px">Trend comparisons use successive observations of the same keyword. Rolling 30-day periods overlap. A candidate signal requires at least +30% searches and no more than +15% competing listings. A confirmed signal additionally requires two positive sequential comparisons, named corroboration, and strong evidence.</div><div class="card">${rows.length?rows.map(x=>{let st=x.confirmed?pill('Confirmed signal'):x.candidate?pill('Candidate • verify','warn'):pill('Observation','dim');return `<div class="recordcard"><div style="flex:1;min-width:0"><h3>${esc(x.term)}</h3><div class="muted small">${esc(nicheName(x.nicheId))} · ${esc(x.date||'')} · ${x.samples} captures</div><div class="recordmeta"><span>Searches ${fmt(x.current)} (${pct(x.growth)})</span><span>Listings ${fmt(x.lis)} (${pct(x.lgrowth)})</span></div><div style="margin-top:9px">${st}</div></div><div class="score ${scoreclass(x.growth===null?null:x.growth*100)}" style="color:${x.growth>=0?'var(--mint)':'var(--red)'}">${pct(x.growth)}</div></div>`}).join(''):cardEmpty('No comparable snapshots','Add two or more dated observations of the same keyword and niche, with measured search volumes.')}</div>`}
function renderRecords(){const types=['competitors','reviews','sources','experiments'];return `<div class="tabs">${types.map(t=>`<button class="tab ${section===t?'active':''}" data-section="${t}">${({competitors:'Competitors',reviews:'Buyer feedback',sources:'Sources',experiments:'Experiments'})[t]}</button>`).join('')}</div>${renderList(section)}<div style="margin-top:17px" class="row"><button class="btn" data-page="trends">View trend alerts →</button><button class="btn" data-page="data">Data & settings →</button></div>`}
function renderData(){const n=Object.keys(db).filter(k=>Array.isArray(db[k])).reduce((sum,k)=>sum+db[k].length,0);return `<div class="grid split"><div class="stack"><article class="card"><div class="sectionhead"><h2>Portable research backup</h2></div><p class="notice">Data is saved in this browser on this device, not automatically to the cloud. Export a JSON backup after each research session. Importing a backup replaces the records on this device.</p><div class="stack">${btn('backup','⇩ Export full JSON backup','primary')}${btn('import','⇧ Restore JSON backup')}${btn('csvall','⇩ Export CSV tables (separate files)')}</div><p class="notice">${fmt(n)} total records · ${db.niches.length} niches · ${db.keywords.length} keyword captures. Private/incognito tabs, browser data clearing, or device loss can delete local data.</p></article><article class="card"><div class="sectionhead"><h2>Research tools</h2></div><div class="stack"><a class="btn" href="https://www.etsy.com/your/shops/me/marketplace-insights" target="_blank" rel="noopener noreferrer">Etsy Marketplace Insights ↗</a><a class="btn" href="https://erank.com/" target="_blank" rel="noopener noreferrer">eRank ↗</a><a class="btn" href="https://trends.google.com/trends/" target="_blank" rel="noopener noreferrer">Google Trends ↗</a></div><p class="notice">These services open separately. This app does not scrape Etsy or automatically download any private marketplace data.</p></article></div><div class="stack"><article class="card"><div class="sectionhead"><h2>Financial assumptions</h2></div><form id="settingsForm" class="stack"><div class="field"><label>Combined modeled variable platform fees (%)</label><input class="input" type="number" name="feePct" step="0.01" min="0" value="${esc(db.settings.feePct)}"></div><div class="field"><label>Flat platform / processing fee per order ($)</label><input class="input" type="number" name="feeFlat" step="0.01" min="0" value="${esc(db.settings.feeFlat)}"></div><div class="field"><label>Labor cost assumption ($ / hour)</label><input class="input" type="number" name="laborHourly" step="0.5" min="0" value="${esc(db.settings.laborHourly)}"></div><div class="field"><label>Minimum test margin (%)</label><input class="input" type="number" name="minMargin" step="1" min="0" max="100" value="${esc(db.settings.minMargin)}"></div><button class="btn primary" type="submit">Save model assumptions</button></form><p class="notice">Fee figures are editable planning assumptions, not a current Etsy quote. Account for taxes, currency conversion, Offsite Ads, returns, fixed fees and other costs before investing.</p></article><article class="card"><div class="sectionhead"><h2>Privacy and storage</h2></div><p class="notice">No account is required in local mode. Research records remain within this browser's site storage until you export, clear them, or your browser removes the data.</p>${btn('clear','Delete all local research data','danger')}</article></div></div>`}
function fieldHtml([key,label,type,required,choices],value){let v=value??(type==='date'?tday():'');let attrs=required?'required':'';let control='';if(type==='niche'){control=`<select name="${key}" ${attrs}><option value="">Select niche</option>${db.niches.map(n=>`<option value="${esc(n.id)}" ${n.id===v?'selected':''}>${esc(n.name)}</option>`).join('')}</select>`}else if(type==='opp'){control=`<select name="${key}" ${attrs}><option value="">Select opportunity</option>${db.opps.map(n=>`<option value="${esc(n.id)}" ${n.id===v?'selected':''}>${esc(n.concept)}</option>`).join('')}</select>`}else if(type==='select'||type==='rating'){let opts=type==='rating'?[0,1,2,3,4,5]:choices;control=`<select name="${key}" ${attrs}><option value="">Select</option>${opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else if(type==='textarea'){control=`<textarea name="${key}" ${attrs}>${esc(v)}</textarea>`}else{control=`<input class="input" type="${type==='number'?'number':type==='url'?'url':type==='date'?'date':'text'}" ${type==='number'?'step="any" min="0"':''} name="${key}" value="${esc(v)}" ${attrs}>`}return `<div class="field ${type==='textarea'?'full':''}"><label for="field-${key}">${esc(label)}${required?' *':''}</label>${control}</div>`}
function openForm(k,id){if(!defs[k])return;const target=id?db[k].find(r=>r.id===id):null;if(k!=='niches'&&!db.niches.length&&k!=='experiments'){toast('Create a niche first.');openForm('niches');return}if(k==='experiments'&&!db.opps.length){toast('Create an opportunity before adding an experiment.');return}const schema=defs[k];document.getElementById('modalRoot').innerHTML=`<div class="modalbackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading"><div class="modalhead"><h2 id="modalHeading">${id?'Edit':'New'} ${schema.title.toLowerCase()}</h2><button class="btn tiny ghost" data-action="close">✕ Close</button></div><form id="recordForm" data-kind="${k}" data-id="${id||''}" style="display:contents"><div class="modalbody"><div class="formgrid">${schema.fields.map(f=>fieldHtml(f,target?.[f[0]])).join('')}</div>${k==='opps'?`<p class="notice">Scoring weights: demand 25%, underserved 20%, momentum 15%, customer gap 15%, economics 15%, feasibility 10%. Do not score unknown data as zero.</p>`:''}</div><div class="modalfoot"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn primary" type="submit">${id?'Save changes':'Save record'}</button></div></form></div></div>`}
function closeForm(){document.getElementById('modalRoot').innerHTML=''}
function download(name,content,mime){const b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function exportBackup(){download('Etsy_NicheIQ_backup_'+tday()+'.json',JSON.stringify({...db,exportedAt:nowISO()},null,2),'application/json');toast('Research backup exported. Save it to Drive for safekeeping.')}
function csv(s){if(!s.length)return '';const props=[...new Set(s.flatMap(r=>Object.keys(r)))];const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';return [props.map(q).join(','),...s.map(r=>props.map(k=>q(r[k])).join(','))].join('\r\n')}
function csvAll(){for(const k of ['niches','keywords','opps','competitors','reviews','sources','experiments'])if(db[k].length)download('NicheIQ_'+k+'_'+tday()+'.csv',csv(db[k]),'text/csv;charset=utf-8');toast('Available CSV tables exported. Your browser may ask about multiple downloads.')}
function copyPrompt(){const n=selectedNiche==='all'?null:db.niches.find(n=>n.id===selectedNiche);const prompt=`Investigate the Etsy niche: ${n?n.name:'[SPECIFY NICHE]'}; target buyer: ${n?.buyer||'[BUYER]'}; region: ${n?.region||'United States'}. Research niche discovery, search demand, competitive listings, customer complaints, recent trends, seasonality and unit economics. Cite every material claim. Label each finding A (direct Etsy/account data), B (third-party measurement), C (public observation) or D (hypothesis). Do not invent search counts or product sales. Identify 20 concepts, score 10 using demand 25%, underserved 20%, momentum 15%, buyer gap 15%, economics 15% and feasibility 10%, then recommend 3 small validation tests. Format observations so they can be entered into the NicheIQ keyword, competitor, source and opportunity records.`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(prompt).then(()=>toast('Research prompt copied')).catch(()=>fallbackCopy(prompt))}else fallbackCopy(prompt)}function fallbackCopy(x){window.prompt('Copy the reusable niche research prompt:',x)}

let count=autoData.niches.reduce((a,n)=>a+(n.opportunities||[]).length,0);
heads+=`<div class="autometas" style="margin-bottom:15px"><span class="autobadge">${autoData.niches.length} researched niches</span><span class="autobadge">${count} candidate concepts</span><span class="autoexplain">Updated ${esc(autoData.generated_at||'Unknown')}</span></div>`;
return heads+autoData.niches.map(n=>{const opps=[...(n.opportunities||[])].sort((a,b)=>(b.research_priority||0)-(a.research_priority||0));return `<article class="autocard"><div class="autometas"><span class="autobadge">Niche #${esc(n.issue_number)}</span><span class="autoexplain">Researched: ${esc(n.researched_at||'—')}</span>${n.changes_since_prior?.new_concepts!=null?`<span class="autobadge">${esc(n.changes_since_prior.new_concepts)} new concepts since last run</span>`:''}</div><h3>${esc(n.niche)}</h3><p>${esc(n.summary||'No sourced summary available.')}</p><div class="autoexplain">${esc(n.evidence_note||'AI-generated research; verify before investing.')}</div><h3>Product opportunities (${opps.length})</h3>${opps.length?opps.map((o,i)=>`<div class="autoitem"><div class="autometas"><span class="autobadge">Research priority ${fmt(o.research_priority||0)}/100</span><span class="autobadge">Evidence ${esc(o.evidence_level||'D')} · ${esc(o.decision||'Unverified')}</span></div><h4>${i+1}. ${esc(o.concept)}</h4><div class="autoexplain"><strong>Buyer:</strong> ${esc(o.buyer||'Undetermined')}</div><div class="autoexplain"><strong>Differentiator:</strong> ${esc(o.differentiation||'Unknown')}</div><div class="autoexplain"><strong>Risk:</strong> ${esc(o.risk||'Unassessed')}</div><div class="autoexplain"><strong>Next test:</strong> ${esc(o.next_test||'Validate demand')}</div><div class="autosources">${sourceLinks(o.source_urls)}</div></div>`).join(''):cardEmpty('No supported product concepts','Insufficient evidence for this niche at the latest run.')}
<div class="autogrid"><div><h4>Keywords to investigate</h4><ul class="autolist">${(n.keywords||[]).map(k=>`<li>${esc(k.term)} <span class="autoexplain">— ${esc(k.reason)}</span><div class="autosources">${sourceLinks(k.source_urls)}</div></li>`).join('')}</ul></div><div><h4>Trends and seasonality</h4><ul class="autolist">${(n.trends||[]).map(t=>`<li>${esc(t.signal)} <span class="autobadge">${esc(t.direction)}</span><div class="autoexplain">${esc(t.reason)}</div><div class="autosources">${sourceLinks(t.source_urls)}</div></li>`).join('')}</ul></div></div><h4>Competitor patterns</h4><ul class="autolist">${(n.competitors||[]).map(c=>`<li>${esc(c.segment)}: ${esc(c.gap_hypothesis)}<div class="autosources">${sourceLinks(c.source_urls)}</div></li>`).join('')}</ul><div class="autoactions"><a class="btn tiny" href="${esc(safeUrl(n.issue_url))}" target="_blank" rel="noopener noreferrer">Edit / close niche ↗</a><a class="btn tiny" href="https://github.com/${AUTO_REPO}/tree/main/data/history/${encodeURIComponent(n.issue_number)}" target="_blank" rel="noopener noreferrer">Research history ↗</a></div></article>`}).join('');
}
async function loadAuto(){autoError='';try{const res=await fetch('./data/latest.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const incoming=await res.json();if(incoming.schema_version!==2||!Array.isArray(incoming.niches))throw Error('Unexpected research feed schema');autoData=incoming;}catch(e){autoError='Could not refresh automatic research ('+e.message+'). Cached research remains visible if available.';}render()}

document.addEventListener('click',ev=>{const pg=ev.target.closest('[data-page]');if(pg){route(pg.dataset.page);return}const sec=ev.target.closest('[data-section]');if(sec){section=sec.dataset.section;render();return}const ac=ev.target.closest('[data-action]');if(!ac)return;const [cmd,k,id]=ac.dataset.action.split(':');if(cmd==='autoadd')registerNiche();if(cmd==='autorefresh')loadAuto();if(cmd==='new')openForm(k);if(cmd==='edit')openForm(k,id);if(cmd==='close')closeForm();if(cmd==='delete'){const r=db[k].find(x=>x.id===id);if(confirm('Delete this '+defs[k].title.toLowerCase()+' record? This cannot be undone unless you restore a backup.')){db[k]=db[k].filter(x=>x.id!==id);save();toast('Record deleted')}}if(cmd==='backup')exportBackup();if(cmd==='import')document.getElementById('importFile').click();if(cmd==='csvall')csvAll();if(cmd==='clear'&&confirm('Delete ALL local research data? Export a JSON backup first.')&&confirm('Final confirmation: permanently clear local records?')){db=emptyData();selectedNiche='all';save()} });
document.addEventListener('submit',ev=>{if(ev.target.id==='recordForm'){ev.preventDefault();const form=ev.target,k=form.dataset.kind,id=form.dataset.id;const old=id?db[k].find(r=>r.id===id):null;const x={...(old||{}),id:old?.id||uid(k),createdAt:old?.createdAt||nowISO(),modifiedAt:nowISO()};for(const field of defs[k].fields){const [key,,type]=field,v=form.elements.namedItem(key)?.value??'';x[key]=['number','rating'].includes(type)?(v===''?'':Number(v)):v.trim()}if(k==='opps'&&x.policyGate==='Pass'&&(!x.source||!x.source.trim())){if(!confirm('This opportunity is marked policy-pass without an evidence URL or reference. Save anyway?'))return}if(old)Object.assign(old,x);else db[k].push(x);closeForm();save();toast('Record saved on this device')}else if(ev.target.id==='settingsForm'){ev.preventDefault();for(const name of ['feePct','feeFlat','laborHourly','minMargin']){let n=Number(ev.target.elements.namedItem(name).value);if(!Number.isFinite(n)||n<0){alert('Enter valid non-negative assumptions.');return}db.settings[name]=n}save();toast('Model assumptions saved')}});
document.getElementById('quickAdd').onclick=()=>{if(page==='dashboard'||page==='auto'||page==='niches')registerNiche();else if(page==='data')exportBackup();else if(page==='trends')openForm('keywords');else if(page==='records')openForm(section);else openForm(page)};document.getElementById('backupTop').onclick=exportBackup;document.getElementById('researchPrompt').onclick=copyPrompt;document.getElementById('nicheFilter').onchange=ev=>{selectedNiche=ev.target.value;render()};
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!parsed||!Array.isArray(parsed.niches)||!Array.isArray(parsed.keywords)||!Array.isArray(parsed.opps))throw Error('Not a compatible NicheIQ backup.');if(!confirm('Restore this backup? It will REPLACE all currently stored records on this phone.'))return;db={...emptyData(),...parsed};for(const k of ['niches','keywords','opps','competitors','reviews','sources','experiments'])if(!Array.isArray(db[k]))db[k]=[];db.settings={...emptyData().settings,...(db.settings||{})};selectedNiche='all';page='dashboard';save();toast('Backup restored')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
render();
loadAuto();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
