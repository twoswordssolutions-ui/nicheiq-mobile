name: NicheIQ automated research
on:
  push:
    branches: [main]
  schedule:
    # Mondays 15:17 UTC; GitHub scheduled runs may start later.
    - cron: '17 15 * * 1'
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: nicheiq-research
  cancel-in-progress: false

jobs:
  research:
    # Prevent unsolicited issues from running AI research using your paid API key.
    if: github.event_name != 'push' && (github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      NICHEIQ_MODEL: gpt-5-mini
      NICHEIQ_MAX_WEEKLY_NICHES: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install --disable-pip-version-check 'openai>=1.99,<3'
      - name: Refresh niche intelligence
        run: python scripts/run_research.py
      - name: Commit changed research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m 'Update NicheIQ automated research'
            git push
          else
            echo 'No research changes to commit.'
          fi

  # GITHUB_TOKEN commits do not automatically trigger a Pages build. Deploy
  # directly in this workflow, and on ordinary human pushes to main.
  deploy:
    needs: research
    if: always() && (github.event_name == 'push' || needs.research.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: nicheiq-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble static site
        run: |
          mkdir -p public/data
          cp index.html manifest.webmanifest service-worker.js icon-192.png icon-512.png public/
          cp data/latest.json public/data/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
